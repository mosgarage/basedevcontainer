services:
  devcontainer:
    container_name: mosgarage
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_FRONTEND: noninteractive
        TZ: Europe/London
        USER_ID: mosgarage
        GROUP_ID: 
        DOCKER_GROUP_ID: ${DOCKER_GROUP_ID}
        PYTHON_VERSION: ${PYTHON_VERSION}
        SSHD_PORT: ${SSHD_PORT}
        START_SSHD: ${START_SSHD}
        mosgarage_PASSWORD: Password123.
    hostname: mosgarage
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/home/officialmofabsmosgarage:/workspaces:cached"
      - "${HOME}/.vscode-server:/home/mosgarage/.vscode-server"
      - "${HOME}/.gitconfig:/home/mosgarage/.gitconfig"
      - "${HOME}/.config/gcloud:/home/mosgarage/.config/gcloud"
      - "${HOME}/.ssh:/home/mosgarage/.ssh"
    # network_mode: host
    env_file:
      - .env
    ports:
     - "60003:${SSHD_PORT}"
